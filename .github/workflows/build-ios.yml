name: Build iOS App (Simulator)

on:
  #push:
    #branches: [main]
  #pull_request:
    #branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Extract version from version.ts
        id: version
        run: |
          VERSION_NAME=$(grep "VERSION_NAME" src/lib/version.ts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep "VERSION_CODE" src/lib/version.ts | head -1 | sed 's/[^0-9]*\([0-9]*\).*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION_NAME ($VERSION_CODE)"

      - name: Add iOS platform
        run: |
          rm -rf ios
          npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Update Xcode project version
        run: |
          cd ios/App
          # Update version in Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.VERSION_NAME }}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.VERSION_CODE }}" App/Info.plist
          echo "Updated iOS version to ${{ steps.version.outputs.VERSION_NAME }} (${{ steps.version.outputs.VERSION_CODE }})"

      - name: Build iOS app (Simulator)
        run: |
          cd ios/App
          xcodebuild \
          -project App.xcodeproj \
          -scheme App \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO


      - name: Create .app archive
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r App.zip App.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.zip
          retention-days: 14
